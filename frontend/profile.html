<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamBox — Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            color: #000000;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .nav a {
            color: #000000;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.4;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .profile-card {
            border: 1px solid #000000;
            padding: 32px;
        }

        .profile-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 32px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #000000;
            font-size: 16px;
            background: transparent;
            outline: none;
        }

        input:focus {
            border-bottom-color: #000000;
        }

        .readonly-field {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin: 32px 0 20px 0;
            padding-top: 20px;
            border-top: 1px solid #EEEEEE;
        }

        .action-link {
            display: inline-block;
            margin-top: 8px;
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.7;
            cursor: pointer;
        }

        .action-link:hover {
            opacity: 0.4;
        }

        .button-link {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 24px;
            padding: 12px;
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .button-link:hover {
            opacity: 0.4;
        }

        .logout-link {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #000000;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px;
        }

        .error {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        .success {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">TeamBox</div>
        <div class="nav">
            <a href="index.html">проекты</a>
            <a href="admin.html">admin</a>
        </div>
    </div>

    <div class="container">
        <div class="profile-card">
            <div class="profile-title">ПРОФИЛЬ</div>

            <div id="message" class="message" style="display: none;"></div>

            <div class="form-group">
                <label>ID</label>
                <input type="text" id="userId" class="readonly-field" readonly>
            </div>

            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" placeholder="username">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email">
            </div>

            <div class="form-group">
                <label>Роль</label>
                <input type="text" id="role" class="readonly-field" readonly>
            </div>

            <a href="#" id="updateProfileBtn" class="button-link">сохранить изменения</a>

            <div class="section-title">СМЕНА ПАРОЛЯ</div>

            <div class="form-group">
                <label>Текущий пароль</label>
                <input type="password" id="oldPassword" placeholder="текущий пароль">
            </div>

            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="newPassword" placeholder="новый пароль">
            </div>

            <div class="form-group">
                <label>Подтверждение пароля</label>
                <input type="password" id="confirmPassword" placeholder="подтвердите пароль">
            </div>

            <a href="#" id="changePasswordBtn" class="button-link">сменить пароль</a>

            <div class="logout-link">
                <a href="#" id="logoutBtn" class="button-link" style="margin-top: 0;">выйти</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let currentUser = null;

        function getToken() { return localStorage.getItem('access_token'); }

        function showMessage(text, isError = true) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.style.display = 'block';
            setTimeout(() => { msgDiv.style.display = 'none'; }, 4000);
        }

        function isAuthenticated() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            const response = await fetch(`${API_URL}${endpoint}`, config);
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = 'login.html';
                throw new Error('Unauthorized');
            }
            return response;
        }

        async function loadProfile() {
            try {
                const response = await apiRequest('/auth/me');
                const user = await response.json();
                currentUser = user;

                document.getElementById('userId').value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('email').value = user.email;
                document.getElementById('role').value = user.role;
            } catch (error) {
                showMessage('Ошибка загрузки профиля');
            }
        }

        async function updateProfile(username, email) {
            try {
                const response = await apiRequest('/auth/me', 'PUT', { username, email });
                if (response.ok) {
                    const updatedUser = await response.json();
                    currentUser = updatedUser;
                    document.getElementById('username').value = updatedUser.username;
                    document.getElementById('email').value = updatedUser.email;
                    showMessage('Профиль обновлён', false);
                } else {
                    const data = await response.json();
                    showMessage(data.detail || 'Ошибка обновления');
                }
            } catch (error) {
                showMessage('Ошибка обновления профиля');
            }
        }

        async function changePassword(oldPassword, newPassword) {
            try {
                const response = await apiRequest('/auth/me/password', 'PUT', {
                    old_password: oldPassword,
                    new_password: newPassword
                });
                if (response.ok) {
                    showMessage('Пароль изменён. Войдите заново.', false);
                    setTimeout(() => {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    const data = await response.json();
                    showMessage(data.detail || 'Ошибка смены пароля');
                }
            } catch (error) {
                showMessage('Ошибка смены пароля');
            }
        }

        async function logout() {
            const refreshToken = localStorage.getItem('refresh_token');
            if (refreshToken) {
                try {
                    await fetch(`${API_URL}/auth/logout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh_token: refreshToken })
                    });
                } catch (err) {}
            }
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = 'login.html';
        }

        document.getElementById('updateProfileBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!username || !email) {
                showMessage('Заполните имя пользователя и email');
                return;
            }

            await updateProfile(username, email);
        });

        document.getElementById('changePasswordBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword) {
                showMessage('Заполните все поля');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Новый пароль и подтверждение не совпадают');
                return;
            }

            if (newPassword.length < 8) {
                showMessage('Пароль должен быть не менее 8 символов');
                return;
            }

            await changePassword(oldPassword, newPassword);
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await logout();
        });

        if (isAuthenticated()) {
            loadProfile();
        }
    </script>
</body>
</html>
