<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamBox — Проекты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            color: #000000;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .nav a {
            color: #000000;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .projects-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }

        .search-input {
            border: none;
            border-bottom: 1px solid #000000;
            padding: 8px 0;
            font-size: 16px;
            background: transparent;
            outline: none;
            width: 250px;
        }

        .search-input:focus {
            border-bottom-color: #000000;
        }

        .search-input::placeholder {
            color: #999999;
        }

        .new-project-link {
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .new-project-link:hover {
            opacity: 0.4;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .project-card {
            border: 1px solid #000000;
            padding: 20px;
            transition: all 0.2s;
        }

        .project-card:hover {
            background: #F5F5F5;
        }

        .project-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .project-description {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .project-actions {
            display: flex;
            gap: 16px;
        }

        .project-actions a {
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .project-actions a:hover {
            opacity: 0.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #FFFFFF;
            border: 1px solid #000000;
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #000000;
            font-size: 16px;
            background: transparent;
            outline: none;
            margin-bottom: 24px;
        }

        .modal-content input::placeholder {
            color: #999999;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .modal-buttons a {
            flex: 1;
            text-align: center;
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            cursor: pointer;
            padding: 8px 0;
        }

        .modal-buttons a:hover {
            opacity: 0.4;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px;
        }

        .error {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        .success {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }
            .projects-header {
                flex-direction: column;
            }
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">TeamBox</div>
        <div class="nav">
            <a href="profile.html">профиль</a>
            <a href="admin.html">admin</a>
        </div>
    </div>

    <div class="container">
        <div class="projects-header">
            <input type="text" id="searchInput" class="search-input" placeholder="поиск проектов">
            <a href="#" id="newProjectBtn" class="new-project-link">+ новый проект</a>
        </div>

        <div id="message" class="message" style="display: none;"></div>

        <div id="projectsGrid" class="projects-grid"></div>
    </div>

    <div id="projectModal" class="modal">
        <div class="modal-content">
            <h3>НОВЫЙ ПРОЕКТ</h3>
            <input type="text" id="projectName" placeholder="название">
            <input type="text" id="projectDescription" placeholder="описание (необязательно)">
            <div class="modal-buttons">
                <a href="#" id="cancelModalBtn">отмена</a>
                <a href="#" id="createProjectBtn">создать</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        function showMessage(text, isError = true) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.style.display = 'block';
            setTimeout(() => { msgDiv.style.display = 'none'; }, 4000);
        }

        function getToken() { return localStorage.getItem('access_token'); }

        function isAuthenticated() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            const response = await fetch(`${API_URL}${endpoint}`, config);
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = 'login.html';
                throw new Error('Unauthorized');
            }
            return response;
        }

        async function loadProjects(search = '') {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';

            try {
                let url = '/projects?skip=0&limit=100';
                if (search) url += `&search=${encodeURIComponent(search)}`;

                const response = await apiRequest(url);
                const projects = await response.json();

                if (!Array.isArray(projects) || projects.length === 0) {
                    grid.innerHTML = '';
                    return;
                }

                grid.innerHTML = projects.map(project => `
                    <div class="project-card" data-id="${project.id}">
                        <div class="project-name">${escapeHtml(project.name)}</div>
                        <div class="project-description">${escapeHtml(project.description || 'нет описания')}</div>
                        <div class="project-actions">
                            <a href="#" class="open-project" data-id="${project.id}">открыть</a>
                            <a href="#" class="delete-project" data-id="${project.id}">удалить</a>
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.open-project').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.location.href = `project.html?id=${btn.dataset.id}`;
                    });
                });

                document.querySelectorAll('.delete-project').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        if (confirm('Удалить проект?')) {
                            await apiRequest(`/projects/${btn.dataset.id}`, 'DELETE');
                            showMessage('Проект удалён', false);
                            loadProjects(document.getElementById('searchInput').value);
                        }
                    });
                });

            } catch (err) {
                grid.innerHTML = '';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function createProject(name, description) {
            const response = await apiRequest('/projects', 'POST', { name, description });
            if (response.ok) {
                showMessage('Проект создан', false);
                closeModal();
                loadProjects(document.getElementById('searchInput').value);
            } else {
                const data = await response.json();
                showMessage(data.detail || 'Ошибка создания');
            }
        }

        const modal = document.getElementById('projectModal');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() {
            modal.style.display = 'none';
            document.getElementById('projectName').value = '';
            document.getElementById('projectDescription').value = '';
        }

        document.getElementById('newProjectBtn').addEventListener('click', (e) => {
            e.preventDefault();
            openModal();
        });

        document.getElementById('cancelModalBtn').addEventListener('click', (e) => {
            e.preventDefault();
            closeModal();
        });

        document.getElementById('createProjectBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const name = document.getElementById('projectName').value.trim();
            if (!name) { showMessage('Введите название проекта'); return; }
            const description = document.getElementById('projectDescription').value.trim();
            await createProject(name, description || null);
        });

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadProjects(e.target.value);
            }, 300);
        });

        if (isAuthenticated()) {
            loadProjects();
        }

        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    </script>
</body>
</html>
