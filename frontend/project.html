<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamBox — Проект</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            color: #000000;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .nav a {
            color: #000000;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #000000;
            text-decoration: none;
            opacity: 0.7;
            font-size: 14px;
        }

        .back-link:hover {
            opacity: 0.4;
        }

        .project-header {
            margin-bottom: 32px;
            padding-bottom: 20px;
        }

        .project-name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .project-description {
            font-size: 14px;
            opacity: 0.7;
        }

        .tabs {
            display: flex;
            gap: 32px;
            margin-bottom: 32px;
        }

        .tab {
            padding-bottom: 8px;
            color: #000000;
            text-decoration: none;
            opacity: 0.5;
            cursor: pointer;
            font-size: 14px;
        }

        .tab.active {
            opacity: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }

        .search-input {
            border: none;
            border-bottom: 1px solid #000000;
            padding: 8px 0;
            font-size: 14px;
            background: transparent;
            outline: none;
            width: 200px;
        }

        .filter-select {
            border: none;
            border-bottom: 1px solid #000000;
            padding: 8px 0;
            font-size: 14px;
            background: transparent;
            outline: none;
            margin-left: 16px;
        }

        .new-task-link {
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            cursor: pointer;
        }

        .new-task-link:hover {
            opacity: 0.4;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            border: 1px solid #000000;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-meta {
            font-size: 12px;
            opacity: 0.6;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .task-status {
            padding: 4px 12px;
            border: 1px solid #000000;
            font-size: 11px;
            background: #FFFFFF;
            color: #000000;
        }

        .task-priority {
            padding: 4px 12px;
            border: 1px solid #000000;
            font-size: 11px;
            background: #FFFFFF;
            color: #000000;
        }

        .task-priority.priority-high {
            background: #000000;
            color: #FFFFFF;
            border: 1px solid #000000;
        }

        .task-actions a {
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.7;
            margin-left: 16px;
        }

        .task-actions a:hover {
            opacity: 0.4;
        }

        .members-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }

        .add-member-form {
            display: flex;
            gap: 16px;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .member-input {
            border: none;
            border-bottom: 1px solid #000000;
            padding: 8px 0;
            font-size: 14px;
            background: transparent;
            outline: none;
            width: 150px;
        }

        .members-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .member-item {
            border: 1px solid #000000;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-role {
            font-size: 12px;
            opacity: 0.6;
        }

        .files-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }

        .file-input {
            border: none;
            border-bottom: 1px solid #000000;
            padding: 8px 0;
            font-size: 14px;
            background: transparent;
            outline: none;
        }

        .files-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-item {
            border: 1px solid #000000;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name {
            font-size: 14px;
        }

        .file-actions a {
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.7;
            margin-left: 16px;
        }

        .file-actions a:hover {
            opacity: 0.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #FFFFFF;
            border: 1px solid #000000;
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #000000;
            font-size: 16px;
            background: transparent;
            outline: none;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .modal-buttons a {
            flex: 1;
            text-align: center;
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            cursor: pointer;
            padding: 8px 0;
        }

        .modal-buttons a:hover {
            opacity: 0.4;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px;
        }

        .error {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        .success {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }
            .tasks-header, .members-header, .files-header {
                flex-direction: column;
            }
            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">TeamBox</div>
        <div class="nav">
            <a href="profile.html">профиль</a>
            <a href="admin.html">admin</a>
        </div>
    </div>

    <div class="container">
        <a href="index.html" class="back-link">← назад</a>

        <div id="message" class="message" style="display: none;"></div>

        <div class="project-header">
            <div class="project-name" id="projectName">Загрузка...</div>
            <div class="project-description" id="projectDescription"></div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="tasks">задачи</div>
            <div class="tab" data-tab="members">участники</div>
            <div class="tab" data-tab="files">файлы</div>
        </div>

        <div id="tasksTab" class="tab-content active">
            <div class="tasks-header">
                <div>
                    <input type="text" id="taskSearch" class="search-input" placeholder="поиск задач">
                    <select id="statusFilter" class="filter-select">
                        <option value="">все статусы</option>
                        <option value="todo">к выполнению</option>
                        <option value="in_progress">в работе</option>
                        <option value="done">готово</option>
                    </select>
                    <select id="priorityFilter" class="filter-select">
                        <option value="">все приоритеты</option>
                        <option value="low">низкий</option>
                        <option value="medium">средний</option>
                        <option value="high">высокий</option>
                    </select>
                </div>
                <a href="#" id="newTaskBtn" class="new-task-link">+ новая задача</a>
            </div>
            <div id="tasksList" class="tasks-list"></div>
        </div>

        <div id="membersTab" class="tab-content">
            <div class="members-header">
                <div class="add-member-form">
                    <input type="number" id="memberUserId" class="member-input" placeholder="ID пользователя">
                    <a href="#" id="addMemberBtn" class="new-task-link">+ добавить</a>
                </div>
            </div>
            <div id="membersList" class="members-list"></div>
        </div>

        <div id="filesTab" class="tab-content">
            <div class="files-header">
                <form id="uploadForm" style="display: flex; gap: 16px; align-items: baseline;">
                    <input type="file" id="fileInput" class="file-input">
                    <a href="#" id="uploadFileBtn" class="new-task-link">+ загрузить</a>
                </form>
            </div>
            <div id="filesList" class="files-list"></div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>НОВАЯ ЗАДАЧА</h3>
            <input type="text" id="taskTitle" placeholder="название">
            <input type="text" id="taskDescription" placeholder="описание (необязательно)">
            <select id="taskPriority">
                <option value="low">низкий</option>
                <option value="medium" selected>средний</option>
                <option value="high">высокий</option>
            </select>
            <div class="modal-buttons">
                <a href="#" id="cancelTaskBtn">отмена</a>
                <a href="#" id="createTaskBtn">создать</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let projectId = null;

        function getToken() { return localStorage.getItem('access_token'); }

        function showMessage(text, isError = true) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.style.display = 'block';
            setTimeout(() => { msgDiv.style.display = 'none'; }, 4000);
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            const response = await fetch(`${API_URL}${endpoint}`, config);
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = 'login.html';
                throw new Error('Unauthorized');
            }
            return response;
        }

        async function loadProjectInfo() {
            const response = await apiRequest(`/projects/${projectId}`);
            const project = await response.json();
            document.getElementById('projectName').textContent = project.name;
            document.getElementById('projectDescription').textContent = project.description || 'нет описания';
        }

        async function loadTasks() {
            const search = document.getElementById('taskSearch').value;
            const status = document.getElementById('statusFilter').value;
            const priority = document.getElementById('priorityFilter').value;

            let url = `/tasks/project/${projectId}?skip=0&limit=100`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (status) url += `&status=${status}`;
            if (priority) url += `&priority=${priority}`;

            const response = await apiRequest(url);
            const tasks = await response.json();
            const container = document.getElementById('tasksList');

            const statusMap = {
                'todo': 'к выполнению',
                'in_progress': 'в работе',
                'done': 'готово'
            };

            const priorityMap = {
                'low': 'низкий',
                'medium': 'средний',
                'high': 'высокий'
            };

            if (!tasks.length) {
                container.innerHTML = '';
                return;
            }


            container.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div class="task-info">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-meta">
                            <span class="task-status">${statusMap[task.status] || task.status}</span>
                            <span class="task-priority priority-${task.priority}">${priorityMap[task.priority] || task.priority}</span>
                            <span>создана: ${new Date(task.created_at).toLocaleDateString()}</span>
                        </div>
                        ${task.description ? `<div style="font-size:12px;opacity:0.6;margin-top:4px;">${escapeHtml(task.description)}</div>` : ''}
                    </div>
                    <div class="task-actions">
                        <a href="#" class="edit-task" data-id="${task.id}">открыть</a>
                        <a href="#" class="delete-task" data-id="${task.id}">удалить</a>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.edit-task').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = `task.html?id=${btn.dataset.id}`;
                });
            });

            document.querySelectorAll('.delete-task').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (confirm('Удалить задачу?')) {
                        await apiRequest(`/tasks/${btn.dataset.id}`, 'DELETE');
                        showMessage('Задача удалена', false);
                        loadTasks();
                    }
                });
            });
        }

        async function createTask(title, description, priority) {
            const response = await apiRequest(`/tasks/project/${projectId}`, 'POST', { title, description, priority });
            if (response.ok) {
                showMessage('Задача создана', false);
                closeTaskModal();
                loadTasks();
            } else {
                const data = await response.json();
                showMessage(data.detail || 'Ошибка создания');
            }
        }

        async function loadMembers() {
            const response = await apiRequest(`/projects/${projectId}/members`);
            const members = await response.json();
            const container = document.getElementById('membersList');

            if (!members.length) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = members.map(m => `
                <div class="member-item">
                    <div>Пользователь ID: ${m.user_id} <span class="member-role">(${m.role})</span></div>
                    <div class="task-actions">
                        <a href="#" class="remove-member" data-user="${m.user_id}">удалить</a>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.remove-member').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (confirm('Удалить участника?')) {
                        await apiRequest(`/projects/${projectId}/members/${btn.dataset.user}`, 'DELETE');
                        showMessage('Участник удалён', false);
                        loadMembers();
                    }
                });
            });
        }

        async function addMember(userId) {
            const response = await apiRequest(`/projects/${projectId}/members?user_id=${userId}`, 'POST');
            if (response.ok) {
                showMessage('Участник добавлен', false);
                loadMembers();
            } else {
                const data = await response.json();
                showMessage(data.detail || 'Ошибка добавления');
            }
        }

        async function loadFiles() {
            const response = await apiRequest(`/files/project/${projectId}`);
            const files = await response.json();
            const container = document.getElementById('filesList');

            if (!files.length) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = files.map(f => `
                <div class="file-item">
                    <div class="file-name">${escapeHtml(f.original_filename)} (${(f.file_size / 1024).toFixed(1)} KB)</div>
                    <div class="file-actions">
                        <a href="${API_URL}/files/download/${f.id}" target="_blank">скачать</a>
                        <a href="#" class="delete-file" data-id="${f.id}">удалить</a>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.delete-file').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (confirm('Удалить файл?')) {
                        await apiRequest(`/files/${btn.dataset.id}`, 'DELETE');
                        showMessage('Файл удалён', false);
                        loadFiles();
                    }
                });
            });
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const token = getToken();
            const response = await fetch(`${API_URL}/files/project/${projectId}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            if (response.ok) {
                showMessage('Файл загружен', false);
                loadFiles();
            } else {
                const data = await response.json();
                showMessage(data.detail || 'Ошибка загрузки');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        const taskModal = document.getElementById('taskModal');
        function openTaskModal() { taskModal.style.display = 'flex'; }
        function closeTaskModal() {
            taskModal.style.display = 'none';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
                if (tab.dataset.tab === 'tasks') loadTasks();
                if (tab.dataset.tab === 'members') loadMembers();
                if (tab.dataset.tab === 'files') loadFiles();
            });
        });

        document.getElementById('newTaskBtn').addEventListener('click', (e) => {
            e.preventDefault();
            openTaskModal();
        });

        document.getElementById('cancelTaskBtn').addEventListener('click', (e) => {
            e.preventDefault();
            closeTaskModal();
        });

        document.getElementById('createTaskBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) { showMessage('Введите название задачи'); return; }
            const description = document.getElementById('taskDescription').value.trim();
            const priority = document.getElementById('taskPriority').value;
            await createTask(title, description || null, priority);
        });

        document.getElementById('addMemberBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('memberUserId').value;
            if (!userId) { showMessage('Введите ID пользователя'); return; }
            await addMember(parseInt(userId));
            document.getElementById('memberUserId').value = '';
        });

        document.getElementById('uploadFileBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) { showMessage('Выберите файл'); return; }
            await uploadFile(fileInput.files[0]);
            fileInput.value = '';
        });

        document.getElementById('taskSearch').addEventListener('input', () => loadTasks());
        document.getElementById('statusFilter').addEventListener('change', () => loadTasks());
        document.getElementById('priorityFilter').addEventListener('change', () => loadTasks());

        const urlParams = new URLSearchParams(window.location.search);
        projectId = urlParams.get('id');
        if (!projectId) { window.location.href = 'index.html'; }

        if (getToken()) {
            loadProjectInfo();
            loadTasks();
        } else {
            window.location.href = 'login.html';
        }

        taskModal.addEventListener('click', (e) => { if (e.target === taskModal) closeTaskModal(); });
    </script>
</body>
</html>
