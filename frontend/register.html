<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamBox — Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 0 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 48px;
            color: #000000;
        }

        .form-group {
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #000000;
            font-size: 16px;
            background: transparent;
            outline: none;
        }

        input:focus {
            border-bottom-color: #000000;
        }

        input::placeholder {
            color: #999999;
            font-weight: 300;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 32px;
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .login-link:hover {
            opacity: 0.4;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px;
        }

        .error {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        .success {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>РЕГИСТРАЦИЯ</h1>

        <div id="message" class="message" style="display: none;"></div>

        <div class="form-group">
            <input type="text" id="username" placeholder="имя пользователя" autocomplete="username">
        </div>

        <div class="form-group">
            <input type="email" id="email" placeholder="почта" autocomplete="email">
        </div>

        <div class="form-group">
            <input type="password" id="password" placeholder="пароль" autocomplete="new-password">
        </div>

        <a href="login.html" class="login-link">войти</a>
    </div>

    <script>
        const API_URL = window.location.origin;

        function showMessage(text, isError = true) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 4000);
        }

        async function register() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !email || !password) {
                showMessage('Заполните все поля');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (data.detail && Array.isArray(data.detail)) {
                        showMessage(data.detail[0].msg || 'Ошибка регистрации');
                    } else {
                        showMessage(data.detail || 'Ошибка регистрации');
                    }
                    return;
                }

                showMessage('Проверьте почту для подтверждения!', false);

                document.getElementById('username').value = '';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';

            } catch (error) {
                showMessage('Ошибка соединения с сервером');
            }
        }

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    register();
                }
            });
        });
    </script>
</body>
</html>
