<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamBox — Admin панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            color: #000000;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .nav a {
            color: #000000;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            border: 1px solid #000000;
            padding: 12px 16px;
            text-align: left;
        }

        .users-table th {
            font-weight: 500;
            background: #F5F5F5;
        }

        .delete-btn {
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.7;
            cursor: pointer;
        }

        .delete-btn:hover {
            opacity: 0.4;
        }

        .message {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px;
        }

        .error {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        .success {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
        }

        .warning {
            color: #000000;
            border: 1px solid #000000;
            background: #FFFFFF;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }
            .users-table th,
            .users-table td {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">TeamBox</div>
        <div class="nav">
            <a href="index.html">проекты</a>
            <a href="profile.html">профиль</a>
        </div>
    </div>

    <div class="container">
        <div class="admin-title">УПРАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯМИ</div>

        <div id="message" class="message" style="display: none;"></div>

        <div id="adminContent">
            <div class="warning">Загрузка...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        function getToken() { return localStorage.getItem('access_token'); }

        function showMessage(text, isError = true) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 4000);
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            const response = await fetch(`${API_URL}${endpoint}`, config);
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = 'login.html';
                throw new Error('Unauthorized');
            }
            return response;
        }

        async function checkAdminAccess() {
            try {
                const response = await apiRequest('/auth/me');
                const user = await response.json();

                if (user.role !== 'super_admin') {
                    document.getElementById('adminContent').innerHTML = `
                        <div class="warning">
                            Доступ запрещён. Эта страница только для администраторов.
                        </div>
                    `;
                    return false;
                }
                return true;
            } catch (error) {
                document.getElementById('adminContent').innerHTML = `
                    <div class="warning">
                        Ошибка проверки прав доступа.
                    </div>
                `;
                return false;
            }
        }

        async function loadUsers() {
            try {
                const response = await apiRequest('/auth/users?skip=0&limit=100');
                const users = await response.json();
                const container = document.getElementById('adminContent');

                if (!users || users.length === 0) {
                    container.innerHTML = '<div class="warning">Нет пользователей</div>';
                    return;
                }

                const currentUserResponse = await apiRequest('/auth/me');
                const currentUser = await currentUserResponse.json();

                container.innerHTML = `
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Имя пользователя</th>
                                <th>Email</th>
                                <th>Роль</th>
                                <th>Действие</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(user => `
                                <tr>
                                    <td>${user.id}</td>
                                    <td>${escapeHtml(user.username)}</td>
                                    <td>${escapeHtml(user.email)}</td>
                                    <td>${user.role}</td>
                                    <td>
                                        ${user.id !== currentUser.id ?
                                            `<a href="#" class="delete-btn" data-id="${user.id}" data-username="${escapeHtml(user.username)}">удалить</a>` :
                                            `<span style="opacity: 0.5;">—</span>`
                                        }
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        const userId = btn.dataset.id;
                        const username = btn.dataset.username;
                        if (confirm(`Удалить пользователя "${username}"?`)) {
                            try {
                                const response = await apiRequest(`/auth/users/${userId}`, 'DELETE');
                                if (response.ok) {
                                    showMessage(`Пользователь "${username}" удалён`, false);
                                    loadUsers();
                                } else {
                                    const data = await response.json();
                                    showMessage(data.detail || 'Ошибка удаления');
                                }
                            } catch (error) {
                                showMessage('Ошибка удаления');
                            }
                        }
                    });
                });

            } catch (error) {
                document.getElementById('adminContent').innerHTML = '<div class="warning">Ошибка загрузки пользователей</div>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function init() {
            if (!getToken()) {
                window.location.href = 'login.html';
                return;
            }

            const hasAccess = await checkAdminAccess();
            if (hasAccess) {
                loadUsers();
            }
        }

        init();
    </script>
</body>
</html>
